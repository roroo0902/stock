<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#109db0" />
  <title>台股下單 / 指數行情</title>

  <style>
    :root{
      --primary:#13a6b8;
      --primary-dark:#0a8f9f;
      --bg:#edf1f2;
      --card:#ffffff;
      --text:#4c5053;
      --muted:#969da1;
      --line:#e6eaec;
      --danger:#d9534f;
      --success:#159a7d;
      --up:#d94040;
      --down:#16885e;
      --warn:#c17a00;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",
        "PingFang TC","Microsoft JhengHei",sans-serif;
    }

    .app{
      width:min(100%,760px);
      min-height:100vh;
      margin:auto;
      background:#fff;
      padding-bottom:115px;
    }

    button{font-family:inherit}

    .top-tabs,.trade-tabs,.segmented,.three-tabs{
      display:grid;
      gap:1px;
      background:#dce3e5;
    }

    .top-tabs{
      grid-template-columns:1fr 1fr;
      padding:10px 12px 0;
      background:#087c84;
    }

    .trade-tabs{
      grid-template-columns:repeat(4,1fr);
      background:#07898f;
    }

    .top-tabs button,.trade-tabs button,.segmented button,.three-tabs button{
      border:0;
      padding:16px 8px;
      background:#fff;
      color:#909699;
      font-size:20px;
      cursor:pointer;
    }

    .top-tabs button:first-child{border-radius:10px 0 0 10px}
    .top-tabs button:last-child{border-radius:0 10px 10px 0}

    .top-tabs .active,.trade-tabs .active,.segmented .active,.three-tabs .active{
      background:var(--primary);
      color:#fff;
      font-weight:700;
    }

    .trade-tabs button{
      background:#07898f;
      color:#88d2d7;
      font-size:18px;
      padding:18px 5px;
    }

    .trade-tabs button.active{
      background:#07898f;
      color:#fff;
    }

    .search-wrap,.section{
      margin:14px;
      padding:14px;
      border-radius:12px;
      background:#f7f8f8;
    }

    .search{
      display:flex;
      align-items:center;
      gap:10px;
      background:#fff;
      border-radius:12px;
      padding:12px 14px;
      border:1px solid #edf0f1;
    }

    .search input{
      width:100%;
      border:0;
      outline:0;
      font-size:18px;
      background:transparent;
    }

    .lookup-btn{
      border:0;
      border-radius:9px;
      padding:10px 13px;
      background:var(--primary);
      color:#fff;
      font-weight:800;
      white-space:nowrap;
      cursor:pointer;
    }

    .lookup-status{
      margin-top:8px;
      font-size:14px;
      color:#777;
      line-height:1.6;
    }

    .lookup-status.warning{
      color:var(--warn);
      font-weight:700;
    }

    .stock-card{
      display:none;
      margin-top:10px;
      padding:14px;
      border-radius:10px;
      background:#fff;
      border:1px solid var(--line);
    }

    .stock-card.ok{
      display:block;
      border-color:#b9e6da;
      background:#f5fffb;
    }

    .stock-card.error{
      display:block;
      border-color:#f1c4c2;
      background:#fff8f8;
    }

    .stock-title{
      display:flex;
      align-items:center;
      gap:9px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }

    .stock-title strong{font-size:21px}

    .badge{
      display:inline-block;
      border-radius:999px;
      padding:4px 9px;
      background:#e9f9fb;
      color:var(--primary-dark);
      font-size:13px;
      font-weight:800;
    }

    .index-mode{
      display:none;
      margin-bottom:10px;
      padding:10px 12px;
      border-radius:9px;
      background:#eef8ff;
      color:#356b89;
      font-weight:700;
      font-size:14px;
    }

    .index-mode.show{
      display:block;
    }

    .quote-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .quote-item{
      border-radius:9px;
      background:#fff;
      border:1px solid #e8eeee;
      padding:9px;
    }

    .quote-label{
      font-size:12px;
      color:#8b9296;
      margin-bottom:3px;
    }

    .quote-value{
      font-size:18px;
      font-weight:800;
      color:#333;
    }

    .up{color:var(--up)!important}
    .down{color:var(--down)!important}
    .flat{color:#666!important}

    .stock-info{
      margin-top:10px;
      font-size:13px;
      color:#70777b;
      line-height:1.8;
    }

    .segmented{
      grid-template-columns:1fr 1fr;
      margin-bottom:10px;
    }

    .three-tabs{
      grid-template-columns:1fr 1fr 1fr;
      margin-bottom:10px;
    }

    .segmented button,.three-tabs button{
      font-size:18px;
      border-radius:8px;
    }

    button:disabled{
      background:#d2d2d2!important;
      color:#999!important;
      cursor:not-allowed;
    }

    .label{
      font-size:16px;
      color:#7c8286;
      margin:12px 0 8px;
    }

    .stepper{
      display:grid;
      grid-template-columns:54px 1fr 54px;
      border:1px solid var(--line);
      border-radius:10px;
      overflow:hidden;
      background:#fff;
    }

    .stepper button{
      border:0;
      background:#c8f0f5;
      color:var(--primary);
      font-size:30px;
      cursor:pointer;
    }

    .stepper input{
      border:0;
      outline:0;
      text-align:center;
      font-size:22px;
      width:100%;
      padding:12px;
    }

    .use-current-price-wrap{
      margin-top:10px;
      display:flex;
      justify-content:flex-end;
    }

    .use-current-price-btn{
      border:1px solid #9edfe7;
      background:#ecfbfd;
      color:var(--primary-dark);
      border-radius:9px;
      padding:10px 14px;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }

    .use-current-price-btn:hover{
      background:#dff7fa;
    }

    .use-current-price-btn:disabled{
      background:#f0f2f3!important;
      border-color:#e1e5e7;
      color:#a7adb0!important;
      cursor:not-allowed;
    }

    .current-price-hint{
      margin-top:6px;
      text-align:right;
      font-size:13px;
      color:#7a8387;
    }

    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .summary{
      background:#fff;
      border:1px solid var(--line);
      border-radius:10px;
      padding:12px;
      font-size:15px;
      line-height:2;
    }

    .summary b{
      float:right;
      color:#222;
    }

    .submit-bar{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:0;
      width:min(100%,760px);
      padding:12px 14px calc(12px + env(safe-area-inset-bottom));
      background:rgba(255,255,255,.97);
      border-top:1px solid #eceff0;
    }

    .submit{
      width:100%;
      border:0;
      border-radius:10px;
      padding:15px;
      background:var(--primary);
      color:#fff;
      font-size:20px;
      font-weight:800;
      cursor:pointer;
    }

    .submit:disabled{
      background:#aaa!important;
      color:#fff!important;
    }

    .msg{
      margin-top:8px;
      text-align:center;
      font-size:14px;
    }

    .msg.ok{color:var(--success)}
    .msg.err{color:var(--danger)}

    .hidden{
      display:none!important;
    }


    .page-nav{display:grid;grid-template-columns:1fr 1fr;background:#087c84;padding:12px;gap:8px}
    .page-nav button{border:1px solid #a1d5d8;border-radius:10px;background:#087c84;color:#e9fdff;font-size:17px;padding:12px;cursor:pointer}
    .page-nav button.active{background:white;color:#087c84;font-weight:800}
    .orders-panel{padding:14px;min-height:50vh}
    .orders-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .orders-head h2{margin:2px 0 5px;font-size:23px}
    .orders-muted{font-size:13px;color:#7b8388;line-height:1.65}
    .reload-orders{border:1px solid #9ddfe3;background:#ebfafc;border-radius:9px;padding:10px 12px;color:#087c84;font-weight:700;cursor:pointer}
    .order-card{margin:12px 0;border:1px solid #e1e8eb;border-radius:12px;padding:13px;background:#fff}
    .order-card-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
    .order-card-header strong{font-size:19px}
    .order-pill{display:inline-block;border-radius:20px;padding:5px 9px;background:#e8f5fa;color:#116f85;font-size:12px;font-weight:700}
    .order-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px 0}
    .order-field small{display:block;color:#828b8f;font-size:12px;margin-bottom:4px}
    .order-field span{font-size:15px;font-weight:700;overflow-wrap:anywhere}
    .order-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #eef0f2;padding-top:10px;flex-wrap:wrap}
    .order-footer button{border:1px solid #d9a3a1;background:#fff7f7;color:#ac3737;padding:9px 12px;border-radius:8px;font-weight:700;cursor:pointer}
    .order-footer button:disabled{opacity:.45;cursor:not-allowed}
    .order-success{color:#11855a;font-weight:700}.order-pending{color:#a36d0d;font-weight:700}
    .orders-error{color:#a63030;padding:15px;border:1px solid #f0cece;border-radius:10px;background:#fff8f8;white-space:pre-wrap}
    .orders-empty{text-align:center;color:#788288;padding:45px 12px}
    [hidden]{display:none!important}

    @media(max-width:600px){
      .trade-tabs button{font-size:15px}
      .section,.search-wrap{margin:10px}
      .grid2{grid-template-columns:1fr}
      .quote-grid{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>

<body>
<main class="app">
  <nav class="page-nav" aria-label="頁面切換">
    <button type="button" id="navTrade" class="active">股票下單</button>
    <button type="button" id="navOrders">今日下單紀錄</button>
  </nav>
  <div id="tradePage">

  <!-- 股票 / ETF 才顯示 -->
  <div id="orderHeader">
    <div class="top-tabs">
      <button class="active" data-market="整股">整股</button>
      <button data-market="零股">零股</button>
    </div>

    <div class="trade-tabs">
      <button class="active" data-side="買進">買進</button>
      <button data-side="賣出">賣出</button>
      <button data-side="取消買進">取消買進</button>
      <button data-side="取消賣出">取消賣出</button>
    </div>
  </div>

  <section class="search-wrap">
    <div class="search">
      <span style="font-size:28px">⌕</span>

      <input
        id="stockInput"
        maxlength="12"
        placeholder="輸入 2330、8299、0050、101、TAIEX"
        autocomplete="off"
      >

      <button
        class="lookup-btn"
        id="lookupBtn"
        type="button"
      >
        查詢
      </button>
    </div>

    <div
      class="lookup-status"
      id="lookupStatus"
    >
      查詢後每 10 秒更新一次行情。
    </div>

    <div
      class="stock-card"
      id="stockCard"
    >

      <div
        class="index-mode"
        id="indexModeNotice"
      >
        指數為純行情模式，不提供買進、賣出或取消委託。
      </div>

      <div class="stock-title">
        <strong id="stockName">—</strong>
        <span class="badge" id="stockMarket">—</span>
        <span class="badge" id="stockType">—</span>
      </div>

      <div class="quote-grid">

        <div class="quote-item">
          <div
            class="quote-label"
            id="lastPriceLabel"
          >
            即時成交價
          </div>
          <div
            class="quote-value"
            id="lastPrice"
          >
            —
          </div>
        </div>

        <div class="quote-item">
          <div class="quote-label">
            昨收
          </div>
          <div
            class="quote-value"
            id="previousClose"
          >
            —
          </div>
        </div>

        <div class="quote-item">
          <div class="quote-label">
            漲跌
          </div>
          <div
            class="quote-value"
            id="changePrice"
          >
            —
          </div>
        </div>

        <div class="quote-item">
          <div class="quote-label">
            漲跌幅
          </div>
          <div
            class="quote-value"
            id="changePercent"
          >
            —
          </div>
        </div>

        <div class="quote-item">
          <div class="quote-label">
            開盤
          </div>
          <div
            class="quote-value"
            id="openPrice"
          >
            —
          </div>
        </div>

        <div class="quote-item">
          <div class="quote-label">
            最高
          </div>
          <div
            class="quote-value"
            id="highPrice"
          >
            —
          </div>
        </div>

        <div class="quote-item">
          <div class="quote-label">
            最低
          </div>
          <div
            class="quote-value"
            id="lowPrice"
          >
            —
          </div>
        </div>

      </div>

      <div class="stock-info">
        代碼：
        <span id="stockCode">—</span>
        <br>

        市場：
        <span id="marketDetail">—</span>
        <br>

        行情日期：
        <span id="quoteDate">—</span>
        <br>

        更新時間：
        <span id="quoteUpdated">—</span>
      </div>

    </div>
  </section>


  <!-- 股票 / ETF 的下單設定 -->
  <div id="orderArea">

    <section class="section">

      <div class="segmented">
        <button
          class="active"
          data-session="整股"
        >
          整股
        </button>

        <button data-session="盤後">
          盤後
        </button>
      </div>

      <div class="three-tabs">
        <button
          class="active"
          data-account="現股"
        >
          現股
        </button>

        <button
          data-account="融資"
          disabled
        >
          融資
        </button>

        <button
          data-account="融券"
          disabled
        >
          融券
        </button>
      </div>

      <div class="three-tabs">
        <button
          class="active"
          data-tif="ROD"
        >
          ROD
        </button>

        <button data-tif="IOC">
          IOC
        </button>

        <button data-tif="FOK">
          FOK
        </button>
      </div>

    </section>


    <section class="section">

      <div class="label">
        單位
      </div>

      <div class="stepper">
        <button
          type="button"
          onclick="stepValue('qty',-1)"
        >
          −
        </button>

        <input
          id="qty"
          type="number"
          min="1"
          step="1"
          value="1"
        >

        <button
          type="button"
          onclick="stepValue('qty',1)"
        >
          ＋
        </button>
      </div>


      <div class="label">
        價位
      </div>

      <div class="segmented">
        <button
          class="active"
          data-price-type="限價"
        >
          限價
        </button>

        <button
          data-price-type="市價"
        >
          市價
        </button>
      </div>

      <div
        class="stepper"
        id="priceStepper"
      >
        <button
          type="button"
          onclick="stepValue('price',-0.1)"
        >
          −
        </button>

        <input
          id="price"
          type="number"
          min="0"
          step="0.1"
          placeholder="輸入委託價格"
        >

        <button
          type="button"
          onclick="stepValue('price',0.1)"
        >
          ＋
        </button>
      </div>

      <div class="use-current-price-wrap">
        <button
          type="button"
          class="use-current-price-btn"
          id="useCurrentPriceBtn"
          disabled
        >
          使用目前價格
        </button>
      </div>

      <div
        class="current-price-hint"
        id="currentPriceHint"
      >
        目前價格：—
      </div>

    </section>


    <section class="section">

      <div class="grid2">

        <div class="summary">
          股票
          <b id="sStock">—</b>
          <br>

          市場
          <b id="sExchange">—</b>
          <br>

          操作
          <b id="sSide">買進</b>
          <br>

          類型
          <b id="sMarket">整股</b>
        </div>

        <div class="summary">
          數量
          <b id="sQty">1 張</b>
          <br>

          價格類型
          <b id="sPriceType">限價</b>
          <br>

          委託價格
          <b id="sPrice">—</b>
          <br>

          預估金額
          <b id="sAmount">—</b>
        </div>

      </div>

    </section>

  </div>
  </div><!-- /tradePage -->
  <section id="ordersPage" class="orders-panel" hidden>
    <div class="orders-head"><div><h2>今日下單紀錄</h2>
      <div class="orders-muted" id="ordersDate">台灣時間</div></div>
      <button class="reload-orders" id="reloadOrders" type="button">重新整理</button>
    </div>
    <p class="orders-muted">以下為委託需求紀錄，AD 欄由人工核取。未勾選不代表委託一定失敗。</p>
    <div id="ordersMessage" class="orders-muted">尚未載入資料</div>
    <div id="ordersList"></div>
  </section>
</main>


<div
  class="submit-bar"
  id="submitBar"
>
  <button
    class="submit"
    id="submitBtn"
    type="button"
    disabled
  >
    請先查詢有效股票代碼
  </button>

  <div
    class="msg"
    id="msg"
  ></div>
</div>


<script>
/* =====================================================
   1. 下單 / 取消 Webhook
===================================================== */

const WEBHOOK_URL =
  "https://hook.us1.make.com/uyw1n1kkqb2giaozdu6me9kurkv9u8w4";


/* =====================================================
   2. GAS 行情 API
===================================================== */

const STOCK_LOOKUP_URL =
  "https://script.google.com/macros/s/AKfycbxvsYNCrUT20ZJd3GzykIzovmt4tpnLL1uVa8oC9fjyYpUrpeIudGw4O-7TtfjzUZfR-Q/exec";


/* =====================================================
   3. 每 10 秒更新
===================================================== */

const QUOTE_REFRESH_MS =
  10000;


/* =====================================================
   State
===================================================== */

const state = {

  market: "整股",

  side: "買進",

  session: "整股",

  account: "現股",

  tif: "ROD",

  priceType: "限價",

  stockValidated: false,

  stock: null,

  quoteTimer: null,

  quoteBusy: false
};


const $ =
  selector =>
    document.querySelector(
      selector
    );


const $$ =
  selector =>
    [
      ...document.querySelectorAll(
        selector
      )
    ];


/* =====================================================
   Tab
===================================================== */

function activate(
  selector,
  clicked
){

  $$(selector).forEach(
    btn =>
      btn.classList.remove(
        "active"
      )
  );

  clicked.classList.add(
    "active"
  );

}


$$("[data-market]").forEach(
  btn => {

    btn.onclick = () => {

      activate(
        "[data-market]",
        btn
      );

      state.market =
        btn.dataset.market;

      updateSummary();

    };

  }
);


$$("[data-side]").forEach(
  btn => {

    btn.onclick = () => {

      activate(
        "[data-side]",
        btn
      );

      state.side =
        btn.dataset.side;

      updateSummary();

    };

  }
);


$$("[data-session]").forEach(
  btn => {

    btn.onclick = () => {

      activate(
        "[data-session]",
        btn
      );

      state.session =
        btn.dataset.session;

    };

  }
);


$$("[data-account]").forEach(
  btn => {

    btn.onclick = () => {

      if(
        btn.disabled
      ){
        return;
      }

      activate(
        "[data-account]",
        btn
      );

      state.account =
        btn.dataset.account;

    };

  }
);


$$("[data-tif]").forEach(
  btn => {

    btn.onclick = () => {

      activate(
        "[data-tif]",
        btn
      );

      state.tif =
        btn.dataset.tif;

    };

  }
);


$$("[data-price-type]").forEach(
  btn => {

    btn.onclick = () => {

      activate(
        "[data-price-type]",
        btn
      );

      state.priceType =
        btn.dataset.priceType;


      const marketPrice =
        state.priceType ===
        "市價";


      $("#price").disabled =
        marketPrice;


      $("#priceStepper").style.opacity =
        marketPrice
          ? ".45"
          : "1";


      updateSummary();

    };

  }
);


/* =====================================================
   股票代碼
===================================================== */

function normalizeStockCode(
  value
){

  return String(
    value || ""
  )
  .trim()
  .toUpperCase()
  .replace(
    /\s+/g,
    ""
  );

}


/* =====================================================
   Timer
===================================================== */

function stopQuoteTimer(){

  if(
    state.quoteTimer
  ){

    clearInterval(
      state.quoteTimer
    );

    state.quoteTimer =
      null;

  }

}


function startQuoteTimer(){

  stopQuoteTimer();


  if(
    !state.stockValidated ||
    !state.stock
  ){
    return;
  }


  state.quoteTimer =
    setInterval(
      () => {

        if(

/* =====================================================
   查詢
===================================================== */

async function lookupStock(){

  const code =
    normalizeStockCode(
      $("#stockInput").value
    );


  clearValidatedStock();


  if(
    !code
  ){

    showLookupError(
      "請輸入股票、ETF 或指數代碼"
    );

    return;
  }


  $("#lookupBtn").disabled =
    true;

  $("#lookupBtn").textContent =
    "查詢中…";


  $("#lookupStatus")
    .classList.remove(
      "warning"
    );


  $("#lookupStatus").textContent =
    "正在查詢股票 / ETF / 指數…";


  try{

    const data =
      await fetchStock(
        code
      );


    if(
      !data.ok ||
      !data.stock
    ){

      showLookupError(
        data.message ||
        "找不到此代碼"
      );

      return;

    }


    applyStockData(
      data.stock,
      true
    );


    state.stockValidated =
      true;


    updateSubmitButton();

    updateSummary();

    startQuoteTimer();


  }catch(err){

    console.error(
      err
    );


    showLookupError(
      "查詢失敗：" +
      err.message
    );


  }finally{

    $("#lookupBtn").disabled =
      false;

    $("#lookupBtn").textContent =
      "查詢";

  }

}


/* =====================================================
   自動更新行情
===================================================== */

async function refreshQuote(
  showStatus
){

  if(
    !state.stockValidated ||
    !state.stock ||
    state.quoteBusy
  ){
    return;
  }


  state.quoteBusy =
    true;


  try{

    if(
      showStatus
    ){

      $("#lookupStatus")
        .textContent =
        "更新行情中…";

    }


    /*
      重要：
      指數使用 GAS 回傳的真正 code，
      例如 101 查到後會變成 IX0043。
    */
    const queryCode =
      state.stock.code;


    const data =
      await fetchStock(
        queryCode
      );


    if(
      data.ok &&
      data.stock
    ){

      applyStockData(
        data.stock,
        false
      );

    }


  }catch(err){

    console.error(
      "行情更新失敗",
      err
    );


  }finally{

    state.quoteBusy =
      false;

  }

}


/* =====================================================
   API
===================================================== */

async function fetchStock(
  code
){

  const url =
    STOCK_LOOKUP_URL +
    "?code=" +
    encodeURIComponent(
      code
    ) +
    "&t=" +
    Date.now();


  const response =
    await fetch(
      url,
      {
        method: "GET",
        cache: "no-store"
      }
    );


  if(
    !response.ok
  ){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  return await response.json();

}


/* =====================================================
   套用行情
===================================================== */

function applyStockData(
  stock,
  firstLoad
){

  state.stock =
    stock;


  $("#stockCard").className =
    "stock-card ok";


  $("#stockName").textContent =
    stock.name ||
    stock.code;


  $("#stockMarket").textContent =
    stock.marketName ||
    stock.market ||
    stock.exchange ||
    "—";


  $("#stockType").textContent =
    stock.assetTypeName ||
    (
      stock.isIndex
        ? "指數"
        : "台股"
    );


  $("#stockCode").textContent =
    stock.code ||
    "—";


  $("#marketDetail").textContent =
    (
      stock.exchange ||
      "—"
    ) +
    " / " +
    (
      stock.market ||
      "—"
    );


  $("#quoteDate").textContent =
    stock.quoteDate ||
    "—";


  $("#quoteUpdated").textContent =
    stock.lastUpdatedText ||
    new Date()
      .toLocaleTimeString(
        "zh-TW"
      );


  /*
    指數：顯示「目前指數」
    股票 / ETF：顯示「即時成交價」
  */
$("#lastPriceLabel").textContent =
  stock.isIndex
    ? "目前指數"
    : "目前報價";


  setQuoteValue(
    "#lastPrice",
    stock.lastPrice
  );


  setQuoteValue(
    "#previousClose",
    stock.previousClose
  );


  setQuoteValue(
    "#openPrice",
    stock.open
  );


  setQuoteValue(
    "#highPrice",
    stock.high
  );


  setQuoteValue(
    "#lowPrice",
    stock.low
  );


  setChangeValue(
    "#changePrice",
    stock.change,
    false
  );


  setChangeValue(
    "#changePercent",
    stock.changePercent,
    true
  );


  /*
    「使用目前價格」按鈕：
    股票 / ETF 有有效目前價格時才可使用。
    指數模式不提供下單，因此保持停用。
  */
  const currentPrice =
    Number(
      stock.lastPrice
    );

  const canUseCurrentPrice =
    !stock.isIndex &&
    Number.isFinite(
      currentPrice
    ) &&
    currentPrice > 0;

  $("#useCurrentPriceBtn").disabled =
    !canUseCurrentPrice;

  $("#currentPriceHint").textContent =
    canUseCurrentPrice
      ? (
          "目前價格：" +
          currentPrice.toLocaleString(
            "zh-TW",
            {
              maximumFractionDigits: 4
            }
          )
        )
      : "目前價格：—";


  /*
    日期驗證
  */
  if(
    stock.quoteIsToday === false
  ){

    $("#lookupStatus")
      .classList.add(
        "warning"
      );


    $("#lookupStatus")
      .textContent =
      stock.quoteWarning ||
      (
        "⚠ 目前不是今日行情：" +
        (
          stock.quoteDate ||
          "日期未知"
        )
      );

  }else{

    $("#lookupStatus")
      .classList.remove(
        "warning"
      );


    $("#lookupStatus")
      .textContent =
      "✓ 今日行情已確認；每 " +
      (
        QUOTE_REFRESH_MS /
        1000
      ) +
      " 秒自動更新";

  }


  /*
    核心：
    指數 → 純行情模式
    股票 / ETF → 下單模式
  */
  setIndexMode(
    stock.isIndex === true
  );


  /*
    股票 / ETF 第一次查詢時，
    自動把目前價格帶入限價欄位。
    指數不做這件事。
  */
  if(
    firstLoad &&
    !stock.isIndex &&
    state.priceType ===
      "限價" &&
    Number(
      stock.lastPrice
    ) > 0
  ){

    /*
      每次重新查詢 / 切換股票成功時，
      都將目前查到的價格同步到委託價格。

      注意：
      每 10 秒自動更新行情時 firstLoad=false，
      因此不會一直改動使用者已設定的委託價格。
    */
    $("#price").value =
      stock.lastPrice;

  }


  updateSummary();

}

/* =====================================================
   顯示數字
===================================================== */

function setQuoteValue(
  selector,
  value
){

  const el =
    $(selector);


  const n =
    Number(value);


  el.className =
    "quote-value";


  if(
    !Number.isFinite(n)
  ){

    el.textContent =
      "—";

    return;

  }


  el.textContent =
    n.toLocaleString(
      "zh-TW",
      {
        maximumFractionDigits: 4
      }
    );

}


/* =====================================================
   漲跌顏色
===================================================== */

function setChangeValue(
  selector,
  value,
  isPercent
){

  const el =
    $(selector);


  const n =
    Number(value);


  el.className =
    "quote-value";


  if(
    !Number.isFinite(n)
  ){

    el.textContent =
      "—";

    return;

  }


  let prefix =
    "";


  if(
    n > 0
  ){

    el.classList.add(
      "up"
    );

    prefix =
      "+";


  }else if(
    n < 0
  ){

    el.classList.add(
      "down"
    );


  }else{

    el.classList.add(
      "flat"
    );

  }


  el.textContent =
    prefix +
    n.toLocaleString(
      "zh-TW",
      {
        maximumFractionDigits: 2
      }
    ) +
    (
      isPercent
        ? "%"
        : ""
    );

}

/* =====================================================
   Stepper
===================================================== */

function stepValue(
  id,
  delta
){

  const el =
    document.getElementById(
      id
    );


  let val =
    Number(
      el.value || 0
    ) +
    delta;


  if(
    id === "qty"
  ){

    val =
      Math.max(
        1,
        Math.round(
          val
        )
      );

  }


  if(
    id === "price"
  ){

    val =
      Math.max(
        0,
        Math.round(
          val * 100
        ) / 100
      );

  }


  el.value =
    val;


  updateSummary();

}

$("#useCurrentPriceBtn")
  .addEventListener(
    "click",
    () => {

      if(
        !state.stockValidated ||
        !state.stock ||
        state.stock.isIndex
      ){
        return;
      }


      const currentPrice =
        Number(
          state.stock.lastPrice
        );


      if(
        !Number.isFinite(
          currentPrice
        ) ||
        currentPrice <= 0
      ){
        return;
      }


      /*
        明確由使用者點擊後，
        才把最新行情價格帶入委託價格。
      */
      $("#price").value =
        currentPrice;


      /*
        若原本在市價，
        使用目前價格時自動切回限價，
        因為價格欄只有限價才有意義。
      */
      if(
        state.priceType ===
        "市價"
      ){

        state.priceType =
          "限價";


        $$("[data-price-type]")
          .forEach(
            btn =>
              btn.classList.remove(
                "active"
              )
          );


        const limitBtn =
          document.querySelector(
            '[data-price-type="限價"]'
          );


        if(
          limitBtn
        ){
          limitBtn.classList.add(
            "active"
          );
        }


        $("#price").disabled =
          false;


        $("#priceStepper").style.opacity =
          "1";

      }


      updateSummary();

    }
  );

function updateSummary(){

  /*
    指數沒有下單摘要
  */
  if(
    state.stock &&
    state.stock.isIndex
  ){
    return;
  }


  const qty =
    Number(
      $("#qty").value ||
      0
    );


  const price =
    state.priceType ===
      "市價"
      ? null
      : Number(
          $("#price").value ||
          0
        );


  const shares =
    state.market ===
      "整股"

      : qty;


  const amount =
    price &&
    shares
      ? Math.round(
          price *
          shares
        )
      : null;


  $("#sStock").textContent =
    state.stockValidated &&
    state.stock
      ? (
          state.stock.code +
          " " +
          state.stock.name
        )
      : "—";


  $("#sExchange").textContent =
    state.stockValidated &&
    state.stock
      ? state.stock.marketName
      : "—";


  $("#sSide").textContent =
    state.side;


  $("#sMarket").textContent =
    state.market;


  $("#sQty").textContent =
    qty +
    (
      state.market ===
        "整股"
        ? " 張"
        : " 股"
    );


  $("#sPriceType").textContent =
    state.priceType;

      : (
          price > 0

                "zh-TW"

            : "—"
        );

    amount
      ? (
          "NT$ " +
          amount.toLocaleString(

          )
        )
      : "—";


  updateSubmitButton();

/* =====================================================
   JSON Payload
===================================================== */

function buildPayload(){

  const qty =
    Number(
      $("#qty").value ||
      0
    );


  const price =
    state.priceType ===
      "市價"
      ? null
      : Number(
          $("#price").value ||
          0
        );


  const shares =
    state.market ===
      "整股"
      ? qty * 1000
      : qty;


  const isCancel =
    state.side ===
      "取消買進" ||
    state.side ===
      "取消賣出";


  return {

    event:
      isCancel
        ? "stock_order_cancel"
        : "stock_order",

    timestamp:
      new Date()
        .toISOString(),

    order: {

      action:
        state.side,

      stockCode:
        state.stock.code,

      stockName:
        state.stock.name,

      exchange:
        state.stock.exchange,

      market:
        state.stock.market,

      marketName:
        state.stock.marketName,

      assetType:
        state.stock.assetTypeName,

      side:
        state.side,

      orderType:
        state.market,

      session:
        state.session,

      accountType:
        state.account,

      timeInForce:
        state.tif,

      priceType:
        state.priceType,

      quantity:
        qty,

      quantityUnit:
        state.market ===
          "整股"
          ? "張"
          : "股",

      shares:
        shares,

      price:
        price,

      estimatedAmount:
        price
          ? Math.round(
              price *
              shares
            )
          : null,

      // Make Webhook: order.originalOrderId
      originalOrderId: isCancel ? selectedOriginalOrderId : ""
    },

    marketSnapshot: {

      quoteDate:
        state.stock.quoteDate,

      quoteIsToday:
        state.stock.quoteIsToday,

      lastPrice:
        state.stock.lastPrice,

      previousClose:
        state.stock.previousClose,

      change:
        state.stock.change,

      changePercent:
        state.stock.changePercent,

      open:
        state.stock.open,

      high:
        state.stock.high,

      low:
        state.stock.low,

      lastUpdated:
        state.stock.lastUpdated
    },

    source: {

      app:
        "github-pages-tw-stock-order",

      userAgent:
        navigator.userAgent
    }

  };

}


/* =====================================================
   驗證
===================================================== */

function validate(
  payload
){

  if(
    state.stock &&
    state.stock.isIndex
  ){

    return "指數僅供行情查看，不能送出委託";

  }


  if(
    !state.stockValidated
  ){

    return "股票代碼尚未通過確認";

  }


  if(
    !payload.order.quantity ||
    payload.order.quantity <= 0
  ){

    return "請輸入正確數量";

  }


  if(
    payload.order.priceType ===
      "限價" &&
    !String(
      payload.order.action
    ).startsWith(
      "取消"
    ) &&
    (
      !payload.order.price ||
      payload.order.price <= 0
    )
  ){

    return "請輸入限價價格";

  }


  if(
    !WEBHOOK_URL ||
    WEBHOOK_URL.includes(
      "YOUR_WEBHOOK"
    )
  ){

    return "請先設定 WEBHOOK_URL";

  }


  return "";

}


/* =====================================================
   送出
===================================================== */

$("#submitBtn").onclick =
  async () => {

    const btn =
      $("#submitBtn");


    const msg =
      $("#msg");


    const payload =
      buildPayload();


    const error =
      validate(
        payload
      );


    msg.className =
      "msg";


    if(
      error
    ){

      msg.textContent =
        error;

      msg.classList.add(
        "err"
      );

      return;

    }


    const confirmText =
      payload.order.action +
      " " +
      payload.order.stockCode +
      " " +
      payload.order.stockName +
      "\n" +
      payload.order.quantity +
      " " +
      payload.order.quantityUnit +
      (
        String(
          payload.order.action
        ).startsWith(
          "取消"
        )
          ? ""
          : (
              "\n價格：" +
              (
                payload.order.priceType ===
                  "市價"
                  ? "市價"
                  : payload.order.price
              )
            )
      );


    if(
      !confirm(
        confirmText
      )
    ){
      return;
    }


    btn.disabled =
      true;


    btn.textContent =
      "傳送中…";


    msg.textContent =
      "";


    try{

      const response =
        await fetch(
          WEBHOOK_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                payload
              )
          }
        );


      if(
        !response.ok
      ){

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      msg.textContent =
        "✓ 資料已傳送";


      msg.classList.add(
        "ok"
      );


    }catch(err){

      console.error(
        err
      );


      msg.textContent =
        "傳送失敗：" +
        err.message;


      msg.classList.add(
        "err"
      );


    }finally{

      updateSubmitButton();

    }

  };


updateSummary();

===================================================== */
// 保存使用者從今日下單紀錄選擇的「原始訂單編號」
// 一般買進／賣出為空；取消時才會填入原始 B 欄 UUID。
let selectedOriginalOrderId = "";

let todayOrders = [];
let todayRefreshTimer = null;
const ORDER_LIST_REFRESH_MS = 30000;
let activePage = "trade";

function showPage(page) {
  activePage = page;
  const isOrders = page === "orders";
  document.getElementById("tradePage").hidden = isOrders;
  document.getElementById("ordersPage").hidden = !isOrders;
  document.getElementById("navTrade").classList.toggle("active", !isOrders);
  document.getElementById("navOrders").classList.toggle("active", isOrders);
  document.getElementById("submitBar").hidden = isOrders || !!(state.stock && state.stock.isIndex);
  if (isOrders) {
    location.hash = "today-orders";
    refreshTodayOrders();
    if (todayRefreshTimer) clearInterval(todayRefreshTimer);
    todayRefreshTimer = setInterval(() => {
      if (!document.hidden) refreshTodayOrders();
    }, ORDER_LIST_REFRESH_MS);
  } else {
    location.hash = "trade";
    if (todayRefreshTimer) clearInterval(todayRefreshTimer);
    todayRefreshTimer = null;
    setIndexMode(!!(state.stock && state.stock.isIndex));
  }
  window.scrollTo(0, 0);
}

document.getElementById("navTrade").onclick = () => showPage("trade");
document.getElementById("navOrders").onclick = () => showPage("orders");
document.getElementById("reloadOrders").onclick = () => refreshTodayOrders();
window.addEventListener("hashchange", () => {
  const target = location.hash === "#today-orders" ? "orders" : "trade";
  if (target !== activePage) showPage(target);
});

function formatNumber(value) {
  if (value === null || value === undefined || value === "") return "—";
  const n = Number(value);
  return Number.isFinite(n) ? n.toLocaleString("zh-TW", {maximumFractionDigits:4}) : String(value);
}
function safeNode(tag, textValue, cls) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  el.textContent = String(textValue ?? "—");
  return el;
}
function asTrue(value) { return value === true || value === "TRUE"; }

async function refreshTodayOrders() {
  const msg = document.getElementById("ordersMessage");
  const list = document.getElementById("ordersList");
  msg.textContent = "讀取今日下單紀錄中…";
  try {
    const url = STOCK_LOOKUP_URL + "?action=todayOrders&t=" + Date.now();
    const response = await fetch(url, {cache:"no-store"});
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    if (!data.ok || !Array.isArray(data.orders)) {
      throw new Error(data.message || "GAS 尚未提供今日訂單查詢 API");
    }
    todayOrders = data.orders;
    document.getElementById("ordersDate").textContent =
      (data.date || new Date().toLocaleDateString("zh-TW", {timeZone:"Asia/Taipei"})) + " · " + todayOrders.length + " 筆";
    renderTodayOrders();
    msg.textContent = todayOrders.length ? "每 30 秒自動更新一次" : "今天尚無下單紀錄";
  } catch (err) {
    list.replaceChildren();
    msg.textContent = "讀取失敗：" + err.message + "。請確認 GAS 已加入 todayOrders 查詢功能且已重新部署。";
    msg.className = "orders-error";
  }
}

function renderTodayOrders() {
  const list = document.getElementById("ordersList");
  const msg = document.getElementById("ordersMessage");
  msg.className = "orders-muted";
  list.replaceChildren();
  const canceledIds = new Set(todayOrders.filter(x=>String(x.action||"").startsWith("取消"))
    .map(x=>String(x.originalOrderId||"")));
  // 後端回傳之最新在前；再次以 row 作保險排序
  const records = [...todayOrders].sort((a,b)=>(Number(b.row)||0)-(Number(a.row)||0));
  const fields = [
    ["下單時間","orderTime"],["操作類型","action"],
    ["股票代碼","stockCode"],["股票名稱","stockName"],
    ["交易單位","orderType"],["委託數量","quantity"],
    ["數量單位","quantityUnit"],["總股數","shares"],
    ["委託價格","price"],["預估交易金額","estimatedAmount"]
  ];
  records.forEach(order => {
    const card = safeNode("article", "", "order-card");
    const header = document.createElement("div");
    header.className = "order-card-header";
    header.append(safeNode("strong", (order.stockCode||"") + " " + (order.stockName||"")),
      safeNode("span", order.action||"", "order-pill"));
    card.appendChild(header);
    const grid = document.createElement("div");
    grid.className = "order-fields";
    fields.forEach(([name,key]) => {
      const cell = document.createElement("div"); cell.className="order-field";
      let value = order[key];
      if (["quantity","shares","price","estimatedAmount"].includes(key)) value=formatNumber(value);
      if (key==="estimatedAmount" && value!=="—") value="NT$ " + value;
      cell.append(safeNode("small",name),safeNode("span",value===null||value===""?"—":value));
      grid.appendChild(cell);
    });
    card.appendChild(grid);
    const footer = document.createElement("div");footer.className="order-footer";
    footer.appendChild(safeNode("span", asTrue(order.confirmed)
      ? (String(order.action).startsWith("取消")?"人工已確認取消成功":"人工已確認下單成功")
      : "尚未人工確認成功", asTrue(order.confirmed)?"order-success":"order-pending"));
    const canCancel = ["買進","賣出"].includes(order.action) && !asTrue(order.confirmed)
      && !!order.orderId && !canceledIds.has(String(order.orderId));
    if (canCancel) {
      const cancel = safeNode("button",order.action==="買進"?"取消買進":"取消賣出");
      cancel.type="button";
      cancel.onclick=()=>submitCancelFromRecord(order);
      footer.appendChild(cancel);
    }
    card.appendChild(footer);
    list.appendChild(card);
  });
}

async function postOrderPayload(payload) {
  const response = await fetch(WEBHOOK_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });
  if (!response.ok) throw new Error("Webhook HTTP " + response.status);
  const raw = await response.text();
  let data;
  try { data=JSON.parse(raw); } catch { throw new Error("Make 尚未回傳 GAS 的 JSON 結果，無法確認是否已寫入"); }
  if (data.ok !== true || !data.orderId) {
    throw new Error(data.message || "GAS 未確認訂單寫入成功");
  }
  return data;
}

async function submitCancelFromRecord(record) {
  const action = record.action === "買進" ? "取消買進" : "取消賣出";
  if (!confirm("確定要提交取消申請？\n"+record.stockCode+" "+record.stockName+
     "\n原始單號："+record.orderId+"\n此操作是申請取消，並非已完成取消。")) return;
  // 使用目前選擇的原始訂單編號，供 GAS 比對 B 欄並寫入 AF 欄。
  selectedOriginalOrderId = String(record.orderId || "").trim();
  if (!selectedOriginalOrderId) {
    alert("缺少原始訂單編號，無法取消。");
    return;
  }
  const payload = {
    event:"stock_order_cancel",timestamp:new Date().toISOString(),
    order:{
      action,side:action,originalOrderId:selectedOriginalOrderId,
      stockCode:record.stockCode,stockName:record.stockName,
      exchange:record.exchange||"",market:record.market||"",
      marketName:record.marketName||"",assetType:record.assetType||"",
      orderType:record.orderType,session:record.session||"整股",
      accountType:record.accountType||"現股",timeInForce:record.timeInForce||"ROD",
      priceType:record.priceType||"限價",quantity:Number(record.quantity),
      quantityUnit:record.quantityUnit,shares:Number(record.shares),
      price:record.price??null,estimatedAmount:record.estimatedAmount??null
    },
    marketSnapshot:{quoteDate:record.quoteDate||"",quoteIsToday:false},
    source:{app:"github-pages-tw-stock-order",userAgent:navigator.userAgent}
  };
  const msg=document.getElementById("ordersMessage");
  msg.textContent="傳送取消申請中…";
  try {
    await postOrderPayload(payload);
    selectedOriginalOrderId = "";
    await refreshTodayOrders();
    alert("取消申請已登錄，請等待人工確認。");
  } catch(err) {
    msg.className="orders-error";
    msg.textContent="取消申請未確認成功："+err.message;
  }
}

// 重新指定送出程序：只在 GAS 確認成功後跳轉。
document.getElementById("submitBtn").onclick = async () => {
  if (state.side.startsWith("取消")) {
    showPage("orders");
    alert("請在今日下單紀錄中，選擇要取消的原始訂單。");
    return;
  }
  const payload=buildPayload();
  const error=validate(payload);
  const msg=document.getElementById("msg");
  msg.className="msg";
  if (error) {msg.textContent=error;msg.classList.add("err");return;}
  const line=payload.order.action+" "+payload.order.stockCode+" "+payload.order.stockName+
    "\n"+payload.order.quantity+" "+payload.order.quantityUnit+
    "\n價格："+(payload.order.priceType==="市價"?"市價":payload.order.price);
  if (!confirm(line)) return;
  const button=document.getElementById("submitBtn");button.disabled=true;
  button.textContent="傳送中…";
  try {
    await postOrderPayload(payload);
    msg.textContent="✓ 下單需求已成功登錄";msg.classList.add("ok");
    showPage("orders");
  } catch(err) {
    msg.textContent="無法確認已登入下單紀錄："+err.message;
    msg.classList.add("err");
  } finally {updateSubmitButton();}
};

// 從頂部取消按鈕進入今日清單選原始訂單
$$('[data-side]').forEach(btn=>{
  const existing=btn.onclick;
  btn.onclick=()=>{
    if (existing) existing();
    if (String(btn.dataset.side).startsWith("取消")) showPage("orders");
  };
});

if (location.hash === "#today-orders") showPage("orders");

</script>

</body>
</html>
